name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build libraries
        run: |
          make -C libs/imgui -j$(nproc)
          make -C libs/imgui-nx -j$(nproc)
          make -C libs/stb_image -j$(nproc)

      - name: Build
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            make -j$(nproc) APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            make -j$(nproc)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: UpThemAll
          path: UpThemAll.nro
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: UpThemAll

      - uses: softprops/action-gh-release@v2
        with:
          files: UpThemAll.nro
          generate_release_notes: true

